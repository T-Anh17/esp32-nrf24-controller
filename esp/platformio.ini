; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env]
platform = espressif32
; LilyGo T-Display-S3 (ESP32-S3). Generic S3 devkit target; native USB-C serial.
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
build_unflags = -std=gnu++11
extra_scripts =
    pre:scripts/generate_html.py
lib_deps = 
    Update
    RF24
    NimBLE-Arduino
    GyverButton
    Preferences
    EEPROM
    Wire
    SPI
    WiFi
    DNSServer
    WebServer

[env:esp32-s3]
build_src_filter = -<*> +<esp32-s3/>
build_flags =
    -std=gnu++17
    -Wl,-z,muldefs
    -Iinclude/esp32-s3
    ; Route Serial to the ESP32-S3 native USB-C port (T-Display-S3 has no USB-UART chip)
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1