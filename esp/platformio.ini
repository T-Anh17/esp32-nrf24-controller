; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env]
; Pinned to pioarduino stable 55.03.313 (Arduino-ESP32 3.3.x / ESP-IDF 5.5).
; The unpinned "espressif32" resolved to 61.04.00+develop (Arduino 4.0-RC1 / IDF 6.1),
; where NimBLE-Arduino 2.5.0 fails to compile (ble_npl_event.event member removed).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
; ESP32-S3-WROOM-1 N8R8 devkit. Generic S3 devkit target; native USB-C serial.
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
build_unflags = -std=gnu++11
extra_scripts =
    pre:scripts/generate_html.py
lib_deps =
    Update
    RF24
    NimBLE-Arduino
    GyverButton
    Preferences
    EEPROM
    Wire
    SPI
    WiFi
    DNSServer
    WebServer
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit BusIO@^1.17.0

[env:esp32-s3]
build_src_filter = -<*> +<esp32-s3/>
build_flags =
    -std=gnu++17
    -Wl,-z,muldefs
    -Iinclude/esp32-s3
    ; Route Serial to the ESP32-S3-WROOM-1 native USB-C port (CDC on boot)
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1